services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: caixinha-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: caixinha
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - caixinha-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caixinha-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/caixinha?authSource=admin
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: 5a6f75e814f88a4dd03f9be26c5f6171a27ea187d86a727e695d1f8b3078623a
      JWT_EXPIRES_IN: 8h
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - caixinha-network
    command: pnpm dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caixinha-frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - caixinha-network
    command: pnpm dev

volumes:
  mongodb_data:

networks:
  caixinha-network:
    driver: bridge
